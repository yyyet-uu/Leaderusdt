  return `${off?'<div class="card sm">⏸ Earning is paused until the next round starts.</div>':''}
<div class="card"><h3>🎯 Daily goals <span class="sm">${dn}/3</span></h3>${goals.map(g=>`<div class="goal"><span>${g[1]>=g[2]?'✅':'⬜'} ${g[0]}</span><span class="sm">${g[1]}/${g[2]}</span></div>${bar(g[1]/g[2]*100)}`).join('')}</div>
<div class="card"><h3>📅 Daily check-in <span class="sm">+${c.ci} or more</span></h3><div class="dots">${[0,1,2,3,4,5,6].map(i=>`<i class="dot${i<S.streak?' on':''}">${i<S.streak?'🔥':i+1}</i>`).join('')}</div><p class="sm" style="margin:10px 0">Streak: ${S.streak} day${S.streak==1?'':'s'}. A longer streak gives a bigger bonus.</p><button class="w" onclick="checkin()" ${off||S.ci?'disabled':''}>${S.ci?'✓ Checked in today':'Check in'}</button></div>
<div class="card"><h3>🎬 Watch ad <span class="sm">+${c.ad}</span></h3><button class="w" onclick="ad()" ${off||!S.adsLeft?'disabled':''}>${S.adsLeft?`Watch ad (${S.adsLeft} left)`:'Next ads in <span id="ac"></span>'}</button></div>
<div class="card"><h3>✅ Tasks <span class="sm">+${c.task} each</span></h3>${S.tasks.map((t,i)=>{const st=T[t.id],rd=st&&Date.now()-st>=c.wait*1e3;return `<div class="row"><span class="nm">${esc(t.title)}</span><button ${t.done||off?'disabled':''} onclick="task(${i})">${t.done?'Done':rd?'Claim':st?'Wait…':'Start'}</button></div>`}).join('')||'<p class="sm">No tasks yet. Check back soon.</p>'}</div>
<div class="card"><h3>➕ Add your task</h3><p class="sm" style="margin-bottom:10px">${S.admin?'Free for you.':fmt(c.cost)+' points. Reviewed before going live.'}</p><input id="tt" placeholder="Task title" maxlength="60"><input id="tu" placeholder="https://link" inputmode="url"><button class="w" onclick="addtask()">Submit task</button></div>`}
function vFr(){const c=S.cfg,ms=Object.entries(c.ms).map(([k,v])=>[+k,v]).sort((a,b)=>a[0]-b[0]),nx=ms.find(m=>m[0]>S.inv);
  return `<div class="card"><h3>👥 Invite and earn <span class="sm">+${c.inv} each</span></h3><div class="link">${esc(S.link)}</div><div class="flex"><button onclick="copy()">Copy link</button><button class="g" onclick="share()">Share</button></div><p class="sm" style="margin-top:12px">${S.inv} friend${S.inv==1?'':'s'} joined this round. No limit on invites!</p></div>
<div class="card"><h3>🎁 Milestone bonuses</h3>${bar(nx?S.inv/nx[0]*100:100)}${ms.map(([n,b])=>`<div class="goal"><span>${S.inv>=n?'✅':'🔒'} ${n} friends</span><b style="color:var(--gold)">+${fmt(b)}</b></div>`).join('')}</div>
<div class="card"><h3>Your friends</h3>${FR===null?'<p class="sm">Loading…</p>':FR.length?FR.map(f=>`<div class="row"><span class="nm">${esc(f.name)}</span><span class="sm">${f.ver?'Verified +'+f.pts:'Pending'}</span></div>`).join(''):'<p class="sm">No invites yet. Share your link to start earning!</p>'}</div>`}
function vWin(){const c=S.cfg;
  return `<div class="card"><h3>📈 Prize ladder</h3>${S.ladder.map((l,i)=>`<div class="goal"><span>Round ${l.n}${i==0?' <span class="sm">'+(S.R.active?'(now)':'(next)')+'</span>':''}</span><b style="color:var(--gold)">${usd(l.p[0])} / ${usd(l.p[1])} USDT</b></div>`).join('')}<p class="sm" style="margin-top:8px">Places 3 to 10 get ${usd(c.top)} USDT each. Prizes grow every round.</p></div>
${WN===null?'<div class="card sm">Loading winners…</div>':WN.length?WN.map(r=>`<div class="card"><h3>🏁 Round ${r.n} winners</h3>${r.winners.map((x,i)=>`<div class="row"><span class="rk">${i+1}</span><span class="nm">${esc(x.name)}<i>${x.un?'@'+esc(x.un):''}</i></span><b>${usd(x.usdt)} USDT</b></div>`).join('')}</div>`).join(''):'<div class="card sm">No winners yet. Round 1 winners will appear here.</div>'}
<div class="card"><h3>❓ FAQ</h3><details><summary>How do I win?</summary><p>Finish in the top places when the round ends on Friday. Points come from invites, ads, tasks and daily check-ins.</p></details><details><summary>When do rounds run?</summary><p>Monday 00:00 to Saturday 00:00 (UTC). The weekend is a countdown to the next round, and points reset every round.</p></details><details><summary>How do I get paid?</summary><p>Winners get a message from the bot. Reply with your USDT (BEP20) address before the next round starts. Every payment is posted in our proof channel.</p></details><details><summary>Why was I removed?</summary><p>Fake accounts, multiple accounts and cheating are not allowed. Flagged users are hidden until reviewed.</p></details></div>
<div class="card"><button class="w g" onclick="go('https://t.me/${esc(c.proof)}')">📜 See payment proof</button>${c.support?`<div style="height:10px"></div><button class="w g" onclick="go('${esc(c.support)}')">💬 Contact support</button>`:''}</div>`}
function vMe(){const u=(W.initDataUnsafe||{}).user||{},L=lvl(S.pts),dn=S.tasks.filter(t=>t.done).length;
  return `<div class="card center">${av({photo:u.photo_url,name:S.name})}<h3 style="margin:10px 0 2px;justify-content:center">${esc(S.name)}</h3><p class="sm">ID ${esc(u.id||'')} · ${L.c[1]} ${L.c[0]}</p></div>
<div class="grid"><div class="st"><span class="sm">Points</span><b>${fmt(S.pts)}</b></div><div class="st"><span class="sm">Rank</span><b>${S.rank?'#'+S.rank:'–'}</b></div><div class="st"><span class="sm">Friends</span><b>${S.inv}</b></div><div class="st"><span class="sm">Ads watched</span><b>${S.adsAll}</b></div><div class="st"><span class="sm">Tasks done</span><b>${dn}</b></div><div class="st"><span class="sm">Streak</span><b>${S.streak} 🔥</b></div></div>
<div class="card" style="margin-top:14px"><h3>🔔 Notifications</h3><p class="sm" style="margin-bottom:10px">Get a bot message for every reward, invite and round update.</p><button class="w" onclick="notif()">Allow bot messages</button></div>`+trust()}
function draw(){
  if(!S||S.gate)return;const R=S.R,p=$('#pill');p.textContent=R.active?'● LIVE · Round '+R.n:R.n?'Break · next round soon':'Starts soon';p.className='pill'+(R.active?' on':'');
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#app').innerHTML=(tab==='home'?hero():mini())+(S.boost?`<div class="boost">⚡ ${S.cfg.bx}x points are live. Final hours, earn now!</div>`:'')+winBox()+({home:vHome,earn:vEarn,fr:vFr,win:vWin,me:vMe}[tab])();tick();
}
function tick(){if(!S||S.gate)return;const R=S.R,end=R.active?R.ends:R.next,c=$('#cd'),a=$('#ac');
  if(c)c.textContent=cd(end-Date.now());if(a)a.textContent=cd(S.adsReset-Date.now());
  if(!tick.b&&(Date.now()>end+1500||(S.adsLeft===0&&Date.now()>S.adsReset))){tick.b=1;load().finally(()=>setTimeout(()=>tick.b=0,5000))}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;if(tab==='fr'){FR=null;loadFr()}if(tab==='win'){WN=null;loadWin()}draw();window.scrollTo(0,0)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&(!S||S.gate))load()});
setInterval(tick,1000);
setInterval(()=>{if(document.hidden||!S||S.gate)return;lb();if(!(document.activeElement&&document.activeElement.tagName==='INPUT'))api('me').then(r=>{if(r.gate)return load();S=r;draw()}).catch(()=>{})},30000);
load();lb();
</script></body></html>
